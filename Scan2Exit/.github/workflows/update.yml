name: EAS Preview Update

on:
  push:
    branches:
      - main

jobs:
  update:
    name: Send OTA Update to Preview
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You need to provide an EXPO_TOKEN secret in GitHub Settings"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: ./Scan2Exit
        run: npm install

      - name: Push Update to Preview
        working-directory: ./Scan2Exit
        run: eas update --branch preview --non-interactive --message "Auto-deploy from GitHub"