name: EAS Preview Update

on:
  push:
    branches:
      - main

jobs:
  update:
    name: Send OTA Update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies & Prevent Yarn
        working-directory: ./Scan2Exit
        run: |
          rm -f yarn.lock
          npm install

      - name: Push Update to Preview
        working-directory: ./Scan2Exit
        run: eas update --branch preview --non-interactive --message "Auto-deploy from GitHub"